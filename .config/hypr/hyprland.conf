
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

#
# Please note not all available settings / options are set here.
# For a full list, see the wiki
#

#autogenerated = 1 # remove this line to remove the warning

# Device info script
exec-once=~/.config/hypr/hyprland/info.sh
source=~/.config/hypr/hyprland/info.conf

# Monitor config
source=~/.config/hypr/hyprland/$type/monitor.conf

# Starup apps
source=~/.config/hypr/hyprland/universal/startup.conf

# Set programs that you use
$terminal = alacritty
$fileManager = dolphin
$menu = wofi --show drun
$browser = firefox

# Universal envs
source=~/.config/hypr/hyprland/universal/env.conf

# Device specific envs
source=~/.config/hypr/hyprland/$type/env.conf

# GPU specific vars
source=~/.config/hypr/hyprland/$type/$gpu.conf

# Sourcing input config
source=~/.config/hypr/hyprland/$type/input.conf

# Sourcing general config
source=~/.config/hypr/hyprland/universal/general.conf

# Sourcing devices config
source=~/.config/hypr/hyprland/$type/devices.conf

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# Keybinds
# Needs to be at EOF
source=~/.config/hypr/hyprland/universal/binds.conf
